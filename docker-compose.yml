# 本機開發用。正式環境的設定放在 deploy/（D03）。
#
# 只啟動資料庫與 Redis（後端用 mvnw spring-boot:run 在本機跑，改程式比較方便）：
#   docker compose up -d db redis
# 啟動整套服務（資料庫＋後端，都在容器裡）：
#   docker compose up --build
#
# 所有 ${...} 的值來自同目錄的 .env（docker compose 會自動讀取）。
# ${VAR:?訊息}：沒設定就直接報錯；${VAR:-預設}：沒設定就用預設值。
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?請先建立 .env，參考 .env.example}
      POSTGRES_USER: ${DB_USERNAME:?請先建立 .env，參考 .env.example}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?請先建立 .env，參考 .env.example}
      TZ: Asia/Taipei
    ports:
      # 只綁定 127.0.0.1，同一個網路的其他電腦連不到這個資料庫
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      # 資料存在 Docker volume，容器刪掉資料還在
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 商品快取（R01）。資料只是快取，重開就清空也沒關係，所以不存到硬碟
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # --save "" --appendonly no：不寫硬碟。maxmemory＋allkeys-lru：最多用 64MB，滿了丟掉最久沒用的
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      # 只綁定本機（同資料庫）。本機用 mvnw spring-boot:run 跑後端時連 localhost:6379
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        # 等資料庫的 healthcheck 通過才啟動後端，避免後端啟動時資料庫還沒準備好而失敗
        condition: service_healthy
    environment:
      # 容器之間用「服務名稱」互相連線：後端連 db:5432，不是 localhost
      # （在容器裡 localhost 指的是容器自己）
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?請在 .env 設定 JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1d}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      APP_PROFILE: ${APP_PROFILE:-}
      REDIS_HOST: redis
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # 商品圖片：容器重建（例如改程式後重新 build）時不會消失
      - uploads-data:/app/uploads

volumes:
  db-data:
  uploads-data:
