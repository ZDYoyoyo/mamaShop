# 正式環境（D03）：Nginx＋後端＋PostgreSQL
#
# 在主機上的 repo 根目錄執行：
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#
# 設定值來自 deploy/.env（從 deploy/.env.example 複製，不進版控）。
# 用 -f 指定這個檔案時，docker compose 以「這個檔案所在的資料夾」（deploy/）為基準：
# .env 讀 deploy/.env，下面的相對路徑也從 deploy/ 算起。
#
# 和本機開發的 docker-compose.yml 的差別：
#   - 多了 web（Nginx）：提供前端網頁，並把 /api 轉給後端
#   - 對外只開 web 的 80 port；資料庫、後端「完全不寫 ports」，只有 Docker 內部網路連得到
#     （Docker 公開的 port 會繞過 ufw 防火牆，見 docs/deploy/D01-server.md）
#   - 不載入測試資料、不開 API 文件

# 專案名稱：決定容器、volume 的名稱前綴（mamashop-prod_db-data）。
# 和本機開發（mamashop）分開，在同一台電腦測試時不會用到同一個資料庫
name: mamashop-prod

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?請先建立 deploy/.env，參考 deploy/.env.example}
      POSTGRES_USER: ${DB_USERNAME:?請在 deploy/.env 設定 DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?請在 deploy/.env 設定 DB_PASSWORD}
      TZ: Asia/Taipei
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # 沒有 ports：只有同一個 Docker 網路裡的 backend 連得到

  backend:
    build: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?請在 deploy/.env 設定 JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1d}
      # 網站網址（例如 https://shop.example.com）。前端和 API 同一個網址，一般不會用到 CORS，
      # 設定成網站網址是保險：萬一被判斷成跨來源請求時仍然允許
      CORS_ALLOWED_ORIGINS: ${SITE_URL:?請在 deploy/.env 設定 SITE_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # 正式環境：不載入測試資料、不開 API 文件
      APP_PROFILE: ""
      API_DOCS_ENABLED: "false"
      # 在 Nginx 後面：相信 Nginx 傳來的 X-Forwarded-Proto／Host／Port，
      # 讓後端知道使用者實際用的是 https://網域（而不是 http://backend:8080）。
      # 沒有這個設定，HTTPS（D04）之後瀏覽器送的 POST 會被當成跨來源請求而被擋
      SERVER_FORWARD_HEADERS_STRATEGY: native
    volumes:
      - uploads-data:/app/uploads
    # 記憶體上限：JVM 依這個值決定 heap（Dockerfile 設定 MaxRAMPercentage=75 → 約 576MB）。
    # 避免後端吃光主機記憶體，連資料庫一起被系統砍掉
    mem_limit: 768m
    # 沒有 ports：只有 Nginx 透過 Docker 內部網路連得到

  web:
    build:
      # 建置時需要 frontend/（前端原始碼）和 deploy/nginx/（設定檔），所以用 repo 根目錄當 context；
      # 根目錄的 .dockerignore 只放行這兩個資料夾
      context: ..
      dockerfile: deploy/nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # 對外只開這一個 port。HTTP_PORT 預設 80；本機測試時可以改成其他 port
      - "${HTTP_PORT:-80}:80"
    volumes:
      # 商品圖片直接由 Nginx 提供（比經過後端快）。:ro 唯讀：Nginx 只讀不寫
      - uploads-data:/srv/uploads:ro

volumes:
  db-data:
  uploads-data:
