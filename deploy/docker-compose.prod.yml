# 正式環境（D03）：Nginx＋後端＋PostgreSQL
#
# 在主機上的 repo 根目錄執行：
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#
# 設定值來自 deploy/.env（從 deploy/.env.example 複製，不進版控）。
# 用 -f 指定這個檔案時，docker compose 以「這個檔案所在的資料夾」（deploy/）為基準：
# .env 讀 deploy/.env，下面的相對路徑也從 deploy/ 算起。
#
# 和本機開發的 docker-compose.yml 的差別：
#   - 多了 web（Nginx）：提供前端網頁，並把 /api 轉給後端
#   - redis：商品快取（R01）、防重複下單（R02）
#   - rabbitmq：訂單通知信（M01）、延遲任務（M02 自動完成、P01 逾時未付款取消）、失敗佇列（M03）
#   - 沒有 mailpit（本機的假寄信伺服器）：寄信用 MAIL_* 設定的真實寄信服務
#   - 對外只開 web 的 80 port；資料庫、後端「完全不寫 ports」，只有 Docker 內部網路連得到
#     （Docker 公開的 port 會繞過 ufw 防火牆，見 docs/deploy/D01-server.md）
#   - 不載入測試資料、不開 API 文件

# 專案名稱：決定容器、volume 的名稱前綴（mamashop-prod_db-data）。
# 和本機開發（mamashop）分開，在同一台電腦測試時不會用到同一個資料庫
name: mamashop-prod

# Docker log 輪替（D07）：預設的 json-file log 會一直長大，幾個月後可能把硬碟塞滿。
# 每個容器最多保留 3 個 10MB 的檔案（滿了刪最舊的）。下面每個服務用 <<: *logging 引用這段。
# x- 開頭的欄位 docker compose 會忽略，專門用來放共用設定（YAML anchor：&logging 定義、*logging 引用）
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    <<: *logging
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?請先建立 deploy/.env，參考 deploy/.env.example}
      POSTGRES_USER: ${DB_USERNAME:?請在 deploy/.env 設定 DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?請在 deploy/.env 設定 DB_PASSWORD}
      TZ: Asia/Taipei
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # 沒有 ports：只有同一個 Docker 網路裡的 backend 連得到

  # 商品快取（R01）：只是快取，不存硬碟；沒有 ports，只有後端連得到
  redis:
    <<: *logging
    image: redis:7.4-alpine
    restart: unless-stopped
    # 不寫硬碟（快取重開就清空沒關係）；最多 64MB，滿了丟掉最久沒用的（allkeys-lru）
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3

  # 訂單通知的佇列（M01）：沒有 ports，只有後端連得到；不裝管理介面（正式環境不需要開網頁介面）
  rabbitmq:
    <<: *logging
    image: rabbitmq:4.1-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-mamashop}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?請在 deploy/.env 設定 RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    # RabbitMQ（Erlang）預設會用很多記憶體；限制 256MB，2GB 的主機才不會被它吃光
    mem_limit: 256m

  backend:
    <<: *logging
    build: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      # Redis 只是快取：沒有它網站也能運作（直接查資料庫），所以只等它「啟動」，不等健康檢查
      redis:
        condition: service_started
      # 通知用：沒有它網站照常運作（通知會遺失），所以也只等它「啟動」
      rabbitmq:
        condition: service_started
    environment:
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-mamashop}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      # 寄信（M01）。MAIL_HOST 空白時不寄信、只記 log（還沒選好寄信服務時）
      SITE_URL: ${SITE_URL}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:-}
      # 宅配送達後多久自動完成（M02），預設 7d
      ORDER_AUTO_COMPLETE_AFTER: ${ORDER_AUTO_COMPLETE_AFTER:-7d}
      # 線上付款（P01）。ECPAY_ENABLED 沒設定 = 只有貨到付款
      ECPAY_ENABLED: ${ECPAY_ENABLED:-false}
      ECPAY_MERCHANT_ID: ${ECPAY_MERCHANT_ID:-}
      ECPAY_HASH_KEY: ${ECPAY_HASH_KEY:-}
      ECPAY_HASH_IV: ${ECPAY_HASH_IV:-}
      ECPAY_CASHIER_URL: ${ECPAY_CASHIER_URL:-https://payment.ecpay.com.tw/Cashier/AioCheckOut/V5}
      ORDER_PAYMENT_TIMEOUT: ${ORDER_PAYMENT_TIMEOUT:-30m}
      # 綠界物流（P02 電子地圖、P03 物流單）。沒設定 = 結帳手動填門市、後台手動填物流單號
      ECPAY_LOGISTICS_ENABLED: ${ECPAY_LOGISTICS_ENABLED:-false}
      ECPAY_LOGISTICS_MERCHANT_ID: ${ECPAY_LOGISTICS_MERCHANT_ID:-}
      ECPAY_LOGISTICS_HASH_KEY: ${ECPAY_LOGISTICS_HASH_KEY:-}
      ECPAY_LOGISTICS_HASH_IV: ${ECPAY_LOGISTICS_HASH_IV:-}
      ECPAY_LOGISTICS_SENDER_NAME: ${ECPAY_LOGISTICS_SENDER_NAME:-}
      ECPAY_LOGISTICS_SENDER_CELL_PHONE: ${ECPAY_LOGISTICS_SENDER_CELL_PHONE:-}
      ECPAY_LOGISTICS_C2C: ${ECPAY_LOGISTICS_C2C:-true}
      ECPAY_LOGISTICS_API_URL: ${ECPAY_LOGISTICS_API_URL:-https://logistics.ecpay.com.tw}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?請在 deploy/.env 設定 JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1d}
      # 網站網址（例如 https://shop.example.com）。前端和 API 同一個網址，一般不會用到 CORS，
      # 設定成網站網址是保險：萬一被判斷成跨來源請求時仍然允許
      CORS_ALLOWED_ORIGINS: ${SITE_URL:?請在 deploy/.env 設定 SITE_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # 正式環境：不載入測試資料、不開 API 文件
      APP_PROFILE: ""
      API_DOCS_ENABLED: "false"
      # 在 Nginx 後面：相信 Nginx 傳來的 X-Forwarded-Proto／Host／Port，
      # 讓後端知道使用者實際用的是 https://網域（而不是 http://backend:8080）。
      # 沒有這個設定，HTTPS（D04）之後瀏覽器送的 POST 會被當成跨來源請求而被擋
      SERVER_FORWARD_HEADERS_STRATEGY: native
    volumes:
      - uploads-data:/app/uploads
    # 記憶體上限：JVM 依這個值決定 heap（Dockerfile 設定 MaxRAMPercentage=75 → 約 576MB）。
    # 避免後端吃光主機記憶體，連資料庫一起被系統砍掉
    mem_limit: 768m
    # 健康檢查（D07）：每 30 秒問一次 /api/actuator/health（也會檢查資料庫連線）。
    # 結果顯示在 docker compose ps 的 STATUS（healthy／unhealthy），web 也等它 healthy 才啟動。
    # wget 是映像檔內建的（Alpine 的 busybox）。start_period：啟動的前 60 秒失敗不算（Spring Boot 啟動要十幾秒）
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # 沒有 ports：只有 Nginx 透過 Docker 內部網路連得到

  web:
    <<: *logging
    build:
      # 建置時需要 frontend/（前端原始碼）和 deploy/nginx/（設定檔），所以用 repo 根目錄當 context；
      # 根目錄的 .dockerignore 只放行這兩個資料夾
      context: ..
      dockerfile: deploy/nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      # 等後端健康檢查通過才啟動 Nginx：剛部署時比較不會看到「伺服器暫時無法使用」
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      # 對外只開這一個 port。HTTP_PORT 預設 80；本機測試時可以改成其他 port
      - "${HTTP_PORT:-80}:80"
    volumes:
      # 商品圖片直接由 Nginx 提供（比經過後端快）。:ro 唯讀：Nginx 只讀不寫
      - uploads-data:/srv/uploads:ro

volumes:
  db-data:
  uploads-data:
  rabbitmq-data:
