# SSH 安全設定（D01）
#
# 放到主機的 /etc/ssh/sshd_config.d/01-mamashop-hardening.conf
#
# ⚠️ 檔名一定要以 01 開頭（比 50 小）：
#    sshd 對同一個設定「先讀到的值為準」，sshd_config.d 裡的檔案依檔名順序讀取。
#    Ubuntu 雲端主機常有 50-cloud-init.conf 寫著 PasswordAuthentication yes，
#    如果這個檔案叫 99-xxx.conf，會比 50 晚讀到，設定就被忽略（密碼登入還是開著）。
#
# 改完先用 `sudo sshd -t` 檢查語法，再 `sudo systemctl restart ssh`，
# 並且「保留目前的連線」，另開一個視窗確認還登得進去，再關掉舊的。

# 只允許 SSH 金鑰登入，關閉密碼登入（擋掉網路上大量的暴力猜密碼）
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no

# 不允許直接用 root 登入：用一般帳號登入，需要時再 sudo
PermitRootLogin no

# 每次連線最多嘗試 3 把金鑰／3 次驗證
MaxAuthTries 3
