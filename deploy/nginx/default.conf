# 正式環境的 Nginx 設定（D03）
#
#   /            前端網頁（Vue 建置出來的靜態檔）
#   /assets/     前端的 JS、CSS（檔名有 hash，可以快取很久）
#   /api/        轉給後端（Spring Boot）
#   /uploads/    商品圖片，直接從 volume 讀（不經過後端）
#
# 這個檔案放在 /etc/nginx/conf.d/，會被引入到 nginx.conf 的 http { } 區塊裡。

# 不在錯誤頁和 Server header 顯示 Nginx 版本（不給攻擊者版本資訊）
server_tokens off;

# 壓縮文字類型的回應：JS、CSS、JSON 通常能小 70% 以上，手機載入快很多
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_vary on;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Docker 內建的 DNS。後端容器重新建立時 IP 可能改變：
    # proxy_pass 用「變數」時，Nginx 會依 resolver 定期重新查詢 IP（valid=10s），
    # 不會一直連到舊的 IP 而回 502（直接寫 proxy_pass http://backend:8080 只在啟動時查一次）
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ===== 前端網頁 =====
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        # Vue Router 用 history 模式（網址像 /products/1）：
        # 找不到對應的檔案時一律回 index.html，交給前端路由處理（否則重新整理就 404）
        try_files $uri $uri/ /index.html;
        # index.html 不快取：部署新版本後，使用者重新整理就能拿到新的 JS 檔名
        add_header Cache-Control "no-cache" always;
    }

    # 前端的 JS、CSS：檔名含內容的 hash（例如 index-DMsfx4y_.js），內容變了檔名就變，
    # 所以可以讓瀏覽器快取一年、不用再問伺服器
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ===== API：轉給後端 =====
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        # Spring Security 也會送這兩個 header：隱藏後端的，只留 security-headers.conf 的一份
        # （同一個 header 出現兩次，有些瀏覽器會整個忽略）
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;

        set $backend http://backend:8080;
        # 用變數時不會改寫路徑：/api/products 原樣轉給 http://backend:8080/api/products
        proxy_pass $backend;

        # 告訴後端「使用者實際連的是什麼」（後端設定 SERVER_FORWARD_HEADERS_STRATEGY=native 會讀這些）
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # 上傳商品圖片：Nginx 預設只收 1MB，超過回 413。後端上限 10MB（B07），這裡放寬到 11MB
        client_max_body_size 11m;
        proxy_read_timeout 60s;
    }

    # ===== 商品圖片：直接從 volume 讀 =====
    # 後端存的檔名是 UUID（B07），內容不會變 → 快取一年
    location /uploads/ {
        include /etc/nginx/snippets/security-headers.conf;
        alias /srv/uploads/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # 不列出目錄內容
        autoindex off;
    }

    # 圖片超過 11MB：回和後端一樣格式的 JSON，前端才能顯示正確的訊息（預設是一頁 HTML）
    error_page 413 = @too_large;
    location @too_large {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/json;
        return 413 '{"success":false,"data":null,"error":{"code":"FILE_TOO_LARGE","message":"檔案超過大小上限（10MB）","fieldErrors":[]}}';
    }
}
