# 正式環境的 Nginx 設定（D03）：只有 HTTP 的版本。
# 有了網域與憑證後改用 HTTPS 的版本（https.conf.template，D04）：deploy/.env 設定 TLS_MODE=https，
# 容器啟動時會用那一份蓋掉這個檔案。兩個版本共用 snippets/site.conf（網站本體）。
#
#   /            前端網頁（Vue 建置出來的靜態檔）
#   /assets/     前端的 JS、CSS（檔名有 hash，可以快取很久）
#   /api/        轉給後端（Spring Boot）
#   /uploads/    商品圖片，直接從 volume 讀（不經過後端）
#
# 這個檔案放在 /etc/nginx/conf.d/，會被引入到 nginx.conf 的 http { } 區塊裡。
# （上面四個路徑的設定在 snippets/site.conf）

# 不在錯誤頁和 Server header 顯示 Nginx 版本（不給攻擊者版本資訊）
server_tokens off;

# 壓縮文字類型的回應：JS、CSS、JSON 通常能小 70% 以上，手機載入快很多
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_vary on;

# HSTS（D04）：告訴瀏覽器「這個網站之後一律用 HTTPS」。只有 HTTPS 的回應才送
# （$scheme 是 http 時值是空字串，Nginx 不會送出值是空的 header），所以 HTTP 模式不受影響。
# 實際送出的地方在 snippets/security-headers.conf。
#   max-age=86400（1 天）：剛啟用 HTTPS 先用短的。瀏覽器記住之後，這段時間內 HTTPS 壞掉網站就打不開（它不肯退回 HTTP）。
#   穩定運作一兩週後改成 31536000（1 年）再重新建置 web。
map $scheme $hsts_header {
    https   "max-age=86400";
    default "";
}

server {
    listen 80;
    server_name _;

    include /etc/nginx/snippets/acme-and-health.conf;
    include /etc/nginx/snippets/site.conf;
}
