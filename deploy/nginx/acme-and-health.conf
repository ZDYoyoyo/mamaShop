# 兩個「一定要用 HTTP（80 port）回應」的路徑，HTTP、HTTPS 兩種模式的 80 port 都 include（D04）。

# Let's Encrypt 的網域驗證（HTTP-01）：certbot 把一個檔案放進 /var/www/certbot，
# Let's Encrypt 的伺服器從外面用 http://網域/.well-known/acme-challenge/檔名 來讀，讀得到就證明這個網域是我們的。
# 申請和每次續期都會用到，所以不能被轉址到 HTTPS 以外的地方、也不能被前端的 index.html 接走。
location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
    try_files $uri =404;
}

# 給 Docker 健康檢查用（docker-compose.prod.yml）：固定回 200，不轉址。
# HTTPS 模式下 80 port 的其他網址都會轉到 https://網域，容器裡的檢查程式不一定連得到那個網址
location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}
