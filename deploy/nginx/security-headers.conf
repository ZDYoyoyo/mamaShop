# 安全相關的 HTTP 回應 header（D03）
#
# 為什麼獨立成一個檔案、在每個 location 都 include：
# Nginx 的 add_header 有個陷阱——location 裡只要有自己的 add_header，
# 外層（server）的 add_header 就「全部不會繼承」。所以統一寫在這裡，每個 location 都引入。
# always：錯誤回應（404、502）也加上

# CSP（Content Security Policy）：只允許從自己的網站載入程式、樣式、圖片。
# 就算有人在商品描述裡塞進 <script>，瀏覽器也不會執行外部或內嵌的程式，降低 XSS 偷走 token 的風險
# （token 存在 localStorage，見 F04 的 NOTES）。
#   script-src 'self'：只執行自己網站的 JS（Vite 建置出來的 index.html 沒有內嵌程式）
#   style-src 'unsafe-inline'：Element Plus 會用 style 屬性設定元件的位置、大小，必須允許
#   img-src data: blob:：Element Plus 的圖示是 data: 圖片；後台上傳前的預覽是 blob: 網址（A02）
#   frame-ancestors 'none'：不允許被別的網站用 iframe 嵌入（防止點擊劫持）
#   form-action：表單只能送到自己的網站，以及綠界的付款頁（P01）與超商電子地圖（P02），兩個都是用表單 POST 過去
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://payment.ecpay.com.tw https://payment-stage.ecpay.com.tw https://logistics.ecpay.com.tw https://logistics-stage.ecpay.com.tw; frame-ancestors 'none'" always;
# 瀏覽器不要猜檔案類型（例如把上傳的圖片當成 HTML 執行）
add_header X-Content-Type-Options "nosniff" always;
# 舊瀏覽器的防 iframe 嵌入（新瀏覽器看 CSP 的 frame-ancestors）
add_header X-Frame-Options "DENY" always;
# 連到別的網站時只帶網域，不帶完整網址（網址裡可能有訂單編號）
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# 網站用不到相機、麥克風、定位：直接關掉
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# HSTS（強制 HTTPS）在 D04 有了 HTTPS 之後再加
