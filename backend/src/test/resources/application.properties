# 測試用設定（會覆蓋 application.yml 的同名設定）
#
# 預設不快取（R01）：很多測試直接用 SQL 改資料再驗證 API 的回應，有快取的話會拿到舊資料。
# 測試快取本身的 ProductCacheIntegrationTest 用 @SpringBootTest(properties = "spring.cache.type=redis") 打開。
spring.cache.type=none

# 每個測試設定不同的測試類別會各自建立一個 Spring context，每個都有自己的連線池。
# 預設每個池 10 條連線，context 一多就超過 PostgreSQL 的上限（100），出現 "too many clients already"。
# 測試是一個一個跑的，用不到那麼多連線
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1

# 訂單通知（M01）：測試預設不送訊息、不啟動 RabbitMQ 的消費者。
# 否則每個測試建立的訂單都會送進 RabbitMQ，堆在佇列裡被別的測試拿到。
# 測試通知本身的 OrderNotificationIntegrationTest 會打開
app.notification.enabled=false
spring.rabbitmq.listener.simple.auto-startup=false

# 逾時自動處理（M02）：測試預設不排定延遲任務。測試延遲任務本身的 OrderAutoCompleteIntegrationTest 會打開
app.order-timeout.enabled=false

# 綠界金流（P01）與物流（P02、P03）：測試預設關閉。
# 本機的 .env 照 .env.example 會打開（ECPAY_ENABLED=true），CI 沒有 .env 是關的；
# 這裡固定成關閉，本機和 CI 跑出來的結果才會一樣。要測這些功能的測試自己用 @SpringBootTest(properties = ...) 打開
app.payment.ecpay.enabled=false
app.logistics.ecpay.enabled=false
