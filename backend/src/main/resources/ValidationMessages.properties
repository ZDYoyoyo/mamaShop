# 參數驗證的預設錯誤訊息（繁體中文）。
# Hibernate Validator 內建的訊息會依伺服器語系變成英文或簡體中文，這裡統一覆蓋。
# DTO 上可以用 message 屬性寫更具體的訊息，例如 @NotBlank(message = "請輸入收件人姓名")。
# {min}、{max}、{value} 會被替換成註解上設定的值。

jakarta.validation.constraints.NotNull.message=為必填
jakarta.validation.constraints.NotBlank.message=為必填
jakarta.validation.constraints.NotEmpty.message=為必填
jakarta.validation.constraints.Size.message=長度需介於 {min} 到 {max} 之間
jakarta.validation.constraints.Min.message=不可小於 {value}
jakarta.validation.constraints.Max.message=不可大於 {value}
jakarta.validation.constraints.Positive.message=必須大於 0
jakarta.validation.constraints.PositiveOrZero.message=不可小於 0
jakarta.validation.constraints.DecimalMin.message=不可小於 {value}
jakarta.validation.constraints.DecimalMax.message=不可大於 {value}
jakarta.validation.constraints.Digits.message=整數最多 {integer} 位、小數最多 {fraction} 位
jakarta.validation.constraints.Email.message=Email 格式不正確
jakarta.validation.constraints.Pattern.message=格式不正確
