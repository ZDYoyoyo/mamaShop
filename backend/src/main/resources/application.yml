spring:
  application:
    name: mamashop

  # 本機開發時，從 repo 根目錄的 .env 讀取設定（和 docker compose 共用同一份）。
  # 檔案不存在也不會報錯（optional）；正式環境改由容器的環境變數提供。
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  profiles:
    # 本機在 .env 設定 APP_PROFILE=dev；正式環境不設定，就不會載入 application-dev.yml（例如測試資料）
    active: ${APP_PROFILE:}

  datasource:
    # 非機密的連線資訊給本機預設值；帳號密碼不給預設值。
    # 沒設定時 Spring 會把 "${DB_USERNAME}" 字面當帳號，啟動時連線失敗，錯誤訊息裡看得到這串字
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mamashop}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  servlet:
    multipart:
      # 上傳檔案大小上限（Tomcat 層級，超過時根本不會進到程式）
      max-file-size: 10MB
      max-request-size: 11MB

  # ===== 商品快取（R01）=====
  cache:
    # redis：用 Redis 快取；none：不快取（測試預設用 none，見 src/test/resources/application.properties）
    type: ${CACHE_TYPE:redis}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redis 掛掉或卡住時最多等 0.5 秒就放棄、改查資料庫：快取不能拖慢網站
      timeout: 500ms
      connect-timeout: 500ms

  # ===== 訂單通知（M01）：RabbitMQ＋寄信 =====
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:mamashop}
    password: ${RABBITMQ_PASSWORD:}
    # 連不上時最多等 2 秒（通知是在背景送的，不影響下單；只是不要卡住執行緒太久）
    connection-timeout: 2s
    listener:
      simple:
        # 處理失敗時不要把訊息放回佇列尾端：否則一直失敗的訊息會無限循環、佔住消費者。
        # 改成下面的重試，重試完還是失敗就移到失敗佇列（M03，MessagingFailureConfig）
        default-requeue-rejected: false
        # 消費者丟例外時，在同一個執行緒裡重試：等 2 秒、再等 6 秒（共 3 次）。
        # 寄信伺服器暫時連不上、資料庫剛好重啟這類「等一下就好」的錯誤，大多重試就會成功
        retry:
          enabled: true
          max-retries: 2
          initial-interval: 2s
          multiplier: 3
          max-interval: 10s
    template:
      # 送訊息（生產者）時 RabbitMQ 連不上：重試 2 次（等 1 秒、2 秒）。送訊息是在背景執行緒（@Async），不影響回應時間
      retry:
        enabled: true
        max-retries: 2
        initial-interval: 1s
        multiplier: 2
  mail:
    # 本機用 Mailpit（假的寄信伺服器，信會顯示在 http://localhost:8025，不會真的寄出）
    # 沒設定 MAIL_HOST 時不寄信，只記 log
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
      # JavaMail 的逾時預設是「無限」：寄信伺服器卡住時，消費者的執行緒會永遠卡住。一定要設定
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  jpa:
    hibernate:
      # Schema 只由 Flyway 管理，Hibernate 只檢查 Entity 和資料表是否一致
      ddl-auto: validate
    # 關閉 Open Session In View：不讓資料庫連線一路開到 Controller 回應結束
    open-in-view: false
    properties:
      hibernate:
        # 載入 LAZY 關聯時，一次用 WHERE id IN (...) 撈回最多 50 筆，而不是一筆一筆查（避免 N+1）。
        # 例如訂單列表一頁 10 筆，明細只會多 1 個查詢，而不是 10 個
        default_batch_fetch_size: 50

# ===== 本專案自訂設定（對應 com.mamashop.security / user 套件裡的 *Properties 類別）=====
app:
  jwt:
    # 簽章用的密鑰，至少 32 字元；沒設定時啟動會失敗（JwtService 會檢查）
    secret: ${JWT_SECRET:}
    # token 有效期間，格式例如 1d、12h、30m
    expiration: ${JWT_EXPIRATION:1d}
  cors:
    # 允許呼叫 API 的前端網址，多個用逗號分隔
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  notification:
    # 訂單通知（M01）。測試預設關閉（src/test/resources/application.properties）
    enabled: ${NOTIFICATION_ENABLED:true}
    # 信裡「查看訂單」的連結
    site-url: ${SITE_URL:http://localhost:5173}
    mail-from: ${MAIL_FROM:mamaShop <no-reply@localhost>}
  order-timeout:
    # 逾時自動處理（M02，RabbitMQ 的 TTL＋死信佇列）。測試預設關閉
    enabled: ${ORDER_TIMEOUT_ENABLED:true}
    # 宅配訂單「已送達」之後多久自動完成（超商取貨不自動完成）。格式：7d、12h、30m
    auto-complete-after: ${ORDER_AUTO_COMPLETE_AFTER:7d}
  admin:
    # 預設管理員：啟動時若這個 email 還不存在就建立。沒設定則略過
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:管理員}
  upload:
    # 上傳檔案存放的目錄（相對路徑以啟動時的工作目錄為準）；正式環境會掛 Docker volume
    dir: ${UPLOAD_DIR:./uploads}
    # 圖片大小上限（程式內再檢查一次）
    max-image-size: 10MB

# ===== 健康檢查（Spring Boot Actuator，D07）=====
# GET /api/actuator/health → {"status":"UP"}；後端有問題或連不到資料庫時回 503 {"status":"DOWN"}
# 給 Docker healthcheck 和外部監控服務定期檢查用。
management:
  endpoints:
    web:
      # 放在 /api 底下：正式環境的 Nginx 已經把 /api 轉給後端，不用另外設定
      base-path: /api/actuator
      exposure:
        # 只開放 health。其他端點（env、beans、heapdump…）會洩漏設定與記憶體內容，絕對不能公開
        include: health
  health:
    # 通知用的 RabbitMQ、寄信伺服器掛掉時，網站照常運作：不要讓健康檢查因此變成 DOWN
    rabbit:
      enabled: false
    mail:
      enabled: false
    redis:
      # Redis 只是快取，掛掉時網站照常運作（直接查資料庫），不要讓健康檢查因此變成 DOWN
      enabled: false
  endpoint:
    health:
      # 不公開細節（資料庫種類、硬碟空間）：給陌生人看的只有 UP／DOWN
      show-details: never
      # 不需要 Kubernetes 的 liveness／readiness 群組（預設會在回應裡列出 groups）
      probes:
        enabled: false

# ===== API 文件（springdoc-openapi，B13）=====
# 預設關閉：API 文件會列出所有後台 API，正式環境不需要公開。本機在 .env 設定 API_DOCS_ENABLED=true
#   Swagger UI：http://localhost:8080/swagger-ui.html
#   OpenAPI JSON：http://localhost:8080/v3/api-docs
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
    # 依路徑與 HTTP 方法排序，畫面比較好找
    operations-sorter: method
    tags-sorter: alpha
    # 重新整理頁面後保留輸入的 token
    persist-authorization: true
